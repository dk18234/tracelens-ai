name: Verify application and real model
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Java contracts and real PostgreSQL integration
        run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser code and report exports
        run: |
          node --check src/main/resources/static/app.js
          node --test scripts/ui-domain.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: target/surefire-reports/
  container-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_TOKEN: local-tracelens-token-change-before-hosting
    steps:
      - uses: actions/checkout@v4
      - name: Build the complete Compose stack and download actual model weights
        run: |
          docker compose config --quiet
          docker compose up --build -d
          curl --fail --retry 90 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost:8081/actuator/health
      - name: Investigate an actual committed-effect case using local AI
        run: python scripts/live_evaluation.py --cases inc_ack_lost --output /tmp/real-model-evaluation.json
      - name: Save service diagnostics
        if: always()
        run: docker compose logs --no-color > /tmp/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-model-container-smoke
          path: |
            /tmp/real-model-evaluation.json
            /tmp/compose.log
      - name: Stop the disposable stack
        if: always()
        run: docker compose down -v
