name: tracelens-ai
services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: tracelens
      POSTGRES_USER: tracelens
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-tracelens_local}
    volumes:
      - evidence-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelens -d tracelens"]
      interval: 3s
      timeout: 3s
      retries: 30
  ollama:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - local-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
  model-init:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$CHAT_MODEL" && ollama pull "$$EMBEDDING_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
  app:
    build: .
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tracelens
      DATABASE_USER: tracelens
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-tracelens_local}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-tracelens-token-change-before-hosting}
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}
      WEBHOOK_LAB_URL: ${WEBHOOK_LAB_URL:-}
      WEBHOOK_ADMIN_TOKEN: ${WEBHOOK_ADMIN_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  evidence-db:
  local-models:
